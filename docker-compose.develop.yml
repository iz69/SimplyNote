# Standalone source-build configuration; uses the same .env as distribution.

services:
  api:
    container_name: simplynote-api
    image: simplynote-api:develop
    build: ./api
    ports:
      - "127.0.0.1:18888:8000"
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-password}
      BASE_PATH: ${API_BASE_PATH:-/simplynote-api}
    volumes:
      - ${SIMPLYNOTE_DATA_DIR:-./data}:/data
    mem_limit: 256m

  ui:
    container_name: simplynote-ui
    image: simplynote-ui:develop
    build: ./ui
    ports:
      - "127.0.0.1:15173:5173"
    restart: unless-stopped
    environment:
      UI_BASE_PATH: ${UI_BASE_PATH:-/simplynote/}
      API_BASE_PATH: ${API_BASE_PATH:-/simplynote-api}
      ENABLE_API: ${ENABLE_API:-true}
      ENABLE_DRIVE: ${ENABLE_DRIVE:-true}
    mem_limit: 256m
